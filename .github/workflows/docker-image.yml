name: Docker Image CI

on:
  push:
    branches: [ "master", "dev" ]
    
env:
  # Change this to your Docker Hub repo name
  ARRDIO_FRONTEND_IMAGE_NAME: ashwinrameshdocker/arrdio-frontend
  ARRDIO_BACKEND_IMAGE_NAME: ashwinrameshdocker/arrdio-api
jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ashwinrameshdocker
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Set image tags
      id: vars
      run: |
          SHA_SHORT="${GITHUB_SHA::7}"

          if [[ "${GITHUB_REF##*/}" == "dev" ]]; then
            # dev builds: dev, dev-<sha>
            echo "TAGS=dev" >> $GITHUB_OUTPUT
          elif [[ "${GITHUB_REF##*/}" == "master" || "${GITHUB_REF##*/}" == "main" ]]; then
            # prod builds: latest, <sha>
            echo "TAGS=latest" >> $GITHUB_OUTPUT
          else
            # fallback (shouldn't happen due to triggers)
            echo "TAGS=${SHA_SHORT}" >> $GITHUB_OUTPUT
          fi

    - name: Build and push Arrdio-Frontend
      uses: docker/build-push-action@v6
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.ARRDIO_FRONTEND_IMAGE_NAME }}:${{ steps.vars.outputs.TAGS }}
          cache-from: type=registry,ref=${{ env.ARRDIO_FRONTEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ARRDIO_FRONTEND_IMAGE_NAME }}:buildcache,mode=max
          
    - name: Build and push Arrdio-Backend
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.ARRDIO_BACKEND_IMAGE_NAME }}:${{ steps.vars.outputs.TAGS }}
          cache-from: type=registry,ref=${{ env.ARRDIO_BACKEND_IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ARRDIO_BACKEND_IMAGE_NAME }}:buildcache,mode=max
      
