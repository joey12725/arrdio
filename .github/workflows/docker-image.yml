name: Build, test and publish
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish (for example v2.0.0). latest and dev are refused.
        required: true
permissions:
  contents: read
env:
  ARRDIO_FRONTEND_IMAGE_NAME: ashwinrameshdocker/arrdio-frontend
  ARRDIO_BACKEND_IMAGE_NAME: ashwinrameshdocker/arrdio-api
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./... && go vet ./...
        working-directory: backend
      - run: npm install -g npm@11.6.2
      - run: npm ci && npm run typecheck && npm run build
        working-directory: frontend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: arrdio-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: arrdio-web:ci

  # Publishing is a deliberate release step, never a side effect of a merge.
  # The tags production's previous compose pulls (latest, dev) are refused, so
  # the old stack cannot pick up this incompatible release by accident.
  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    environment: Ashwin_Docker_Hub
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] || [[ "$TAG" == latest || "$TAG" == dev ]]; then
            echo "Refusing image tag '$TAG'" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ashwinrameshdocker
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.ARRDIO_BACKEND_IMAGE_NAME }}:${{ inputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ${{ env.ARRDIO_FRONTEND_IMAGE_NAME }}:${{ inputs.tag }}
