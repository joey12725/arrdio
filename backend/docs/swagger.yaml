host: localhost:2130
info:
  contact: {}
  description: API for searching and downloading books and audiobooks from various
    sources
  title: Arrdio API
  version: "1.0"
paths:
  /abb/searchbooks:
    post:
      consumes:
      - application/json
      parameters:
      - description: Search request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AudiobookResult'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Search audiobooks on Audiobookbay
      tags:
      - ABB
  /openlibrary/search:
    post:
      consumes:
      - application/json
      parameters:
      - description: Search request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/openlibrary.SearchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/openlibrary.SearchResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Search books on Open Library
      tags:
      - OpenLibrary
  /prowlarr/searchbooks:
    post:
      consumes:
      - application/json
      parameters:
      - description: Search request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AudiobookResult'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Search audiobooks via Prowlarr
      tags:
      - Prowlarr
  /qbit/addtorrents:
    post:
      consumes:
      - application/json
      parameters:
      - description: Torrent request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/qbit.TorrentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/qbit.TorrentResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Add torrents to qBittorrent
      tags:
      - qBittorrent
  /zlib/deletecategory/{category}:
    delete:
      parameters:
      - description: Category name
        in: path
        name: category
        required: true
        type: string
      responses:
        "200":
          description: Delete successful
          schema:
            type: string
        "404":
          description: Category not found
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Delete a category
      tags:
      - ZLibrary
  /zlib/deleteuser/{email}:
    delete:
      parameters:
      - description: User email
        in: path
        name: email
        required: true
        type: string
      responses:
        "200":
          description: Delete successful
          schema:
            type: string
        "404":
          description: User not found
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Delete a ZLibrary user
      tags:
      - ZLibrary
  /zlib/downloadbook:
    post:
      consumes:
      - application/json
      deprecated: true
      parameters:
      - description: Download request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/zlib.DownloadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/zlib.DownloadResponse'
        "206":
          description: Partial content (quota exceeded)
          schema:
            $ref: '#/definitions/zlib.DownloadResponse'
        "400":
          description: Invalid request
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Download ebooks from ZLibrary
      tags:
      - ZLibrary
  /zlib/getcategory:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/zlib.CategoryResponse'
            type: array
        "500":
          description: Server error
          schema:
            type: string
      summary: Get all categories
      tags:
      - ZLibrary
  /zlib/getzlibuser:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/zlib.ZLibUser'
            type: array
        "500":
          description: Server error
          schema:
            type: string
      summary: Get all ZLibrary users
      tags:
      - ZLibrary
  /zlib/putcategory:
    put:
      consumes:
      - application/json
      parameters:
      - description: Category request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/zlib.CategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/zlib.CategoryResponse'
        "400":
          description: Invalid request or duplicate entry
          schema:
            type: string
      summary: Add a category
      tags:
      - ZLibrary
  /zlib/putzlibuser:
    put:
      consumes:
      - application/json
      parameters:
      - description: User request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/zlib.ZLibUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/zlib.ZLibUser'
        "400":
          description: Invalid request or duplicate entry
          schema:
            type: string
      summary: Add a ZLibrary user
      tags:
      - ZLibrary
  /zlib/refreshusers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: Users refreshed
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Refresh ZLibrary user credentials
      tags:
      - ZLibrary
  /zlib/searchbook:
    post:
      consumes:
      - application/json
      deprecated: true
      parameters:
      - description: Search request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.EbookResult'
        "400":
          description: Invalid request
          schema:
            type: string
        "424":
          description: No Zlibrary Users Defined
          schema:
            type: string
        "500":
          description: Server error
          schema:
            type: string
      summary: Search ebooks on ZLibrary
      tags:
      - ZLibrary
      - Deprecieate
swagger: "2.0"
