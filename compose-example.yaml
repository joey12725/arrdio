version: "3.9"
services:
  api:
    image: arrdio-api:latest
    container_name: arrdio-api
    # Persist the DB (and anything else you might write) on the host
    volumes:
      - db-data:/app/data
      - ./ebooks:/ebooks:rw
    ports:
      - "2130:2130"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2130/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: ["internal"]

  frontend:
    image: arrdio-frontend:latest
    container_name: arrdio-frontend
    environment:
      NUXT_OIDC_TOKEN_KEY: 
      NUXT_OIDC_SESSION_SECRET: 
      NUXT_OIDC_AUTH_SESSION_SECRET: 

      # your generic OIDC provider (key = "oidc")
      NUXT_OIDC_PROVIDERS_OIDC_CLIENT_ID: 
      NUXT_OIDC_PROVIDERS_OIDC_CLIENT_SECRET: 
      NUXT_OIDC_PROVIDERS_OIDC_BASE_URL: 
      NUXT_OIDC_PROVIDERS_OIDC_REDIRECT_URI: 
      # rest of your public config
      NUXT_PUBLIC_API_BASE: http://api:2130
    ports:
      - "3000:3000"
    depends_on: [api]
    restart: unless-stopped
    networks: ["internal"]
    # volumes:
    #   - db-data:/ebooks



volumes:
  db-data:          # lives at the Docker volumes directory automatically

networks:
  internal:
    driver: bridge
