# Production example for the durable acquisition release. See docs/OPERATIONS.md.
#
# Secrets come from two operator-owned env files outside the checkout (mode 0600),
# one per service, so the web container never holds provider credentials. They
# never come from this file, build arguments or image layers. Validate with
# `docker compose -f compose-example.yaml config --quiet`; never print the
# resolved config, because it contains those secrets.
#
# Images build from this checkout by default (`docker compose -f compose-example.yaml
# up --build`). To run prebuilt images instead, set ARRDIO_API_IMAGE /
# ARRDIO_WEB_IMAGE and pin ARRDIO_IMAGE_TAG to an explicit version.
services:
  api:
    build: ./backend
    image: ${ARRDIO_API_IMAGE:-arrdio-api}:${ARRDIO_IMAGE_TAG:-local}
    container_name: arrdio-api
    restart: unless-stopped
    # Must own the data directory and be able to write the library routes.
    # On NAS shared media this is often 99:100 (nobody:users on Unraid).
    user: ${ARRDIO_UID:-10001}:${ARRDIO_GID:-10001}
    env_file:
      - ${ARRDIO_API_ENV_FILE:?api secrets env file}
    environment:
      ARRDIO_JOBS_DB: /data/jobs.db
      ARRDIO_STAGING: /data/staging
      ARRDIO_ENCRYPTION_KEY_FILE: /run/secrets/arrdio_encryption_key
      ARRDIO_ROUTES_FILE: /config/routes.json
      ARRDIO_TORRENT_ROOT: /payloads/torrents
      # qBittorrent's own path for the folder mounted at /payloads/torrents.
      QBITTORRENT_PATH: ${QBITTORRENT_PATH:-/downloads}
      ARRDIO_SOULSEEK_ROOT: /payloads/soulseek
      # Keep false for the first start; enable after Settings shows every
      # source and library as ready.
      ARRDIO_WORKERS: ${ARRDIO_WORKERS:-false}
    volumes:
      # Whole application directory: database, WAL, staging and checkpoints.
      - ${ARRDIO_DATA_DIR:?persistent application data directory}:/data
      - ${ARRDIO_ROUTES_PATH:?operator-approved routes.json}:/config/routes.json:ro
      # qBittorrent's whole download root (the host folder it mounts at
      # QBITTORRENT_PATH), including its incomplete folder: partially selected
      # packs stay there. The category save path must be inside it and outside
      # the libraries; ARRDIO copies into them and the torrent keeps seeding here.
      - ${ARRDIO_TORRENT_DIR:?host folder of the qBittorrent download root}:/payloads/torrents:ro
      - ${ARRDIO_SOULSEEK_DIR:?host folder of slskd completed downloads}:/payloads/soulseek:ro
      # One mount per routes.json destination, at the same container path.
      - ${ARRDIO_EBOOK_LIBRARY:?host ebook library root}:/libraries/books
      - ${ARRDIO_AUDIO_LIBRARY:?host audiobook library root}:/libraries/audiobooks
    secrets:
      - arrdio_encryption_key
    # No published port: only the frontend's server reaches the API. Uses the
    # stack's default network so Prowlarr, qBittorrent and the libraries resolve.
    expose:
      - "2131"

  frontend:
    build: ./frontend
    image: ${ARRDIO_WEB_IMAGE:-arrdio-frontend}:${ARRDIO_IMAGE_TAG:-local}
    container_name: arrdio-frontend
    restart: unless-stopped
    env_file:
      - ${ARRDIO_WEB_ENV_FILE:?web secrets env file}
    environment:
      NUXT_ARRDIO_BASE: http://api:2131
    ports:
      - "${ARRDIO_WEB_BIND:-127.0.0.1}:${ARRDIO_WEB_PORT:-3000}:3000"
    depends_on: [api]

secrets:
  arrdio_encryption_key:
    # Exactly 32 random bytes, readable by the api user. Back it up with the
    # data directory: accounts cannot be decrypted without it.
    file: ${ARRDIO_ENCRYPTION_KEY_PATH:?file holding the 32-byte encryption key}
